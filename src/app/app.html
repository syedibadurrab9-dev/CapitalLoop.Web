<div class="flex flex-col min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  @if (isLoggedInSignal()) {
    
    <div class="admin-grid-layout full-viewport-horizon">
      
      <div class="col-span-3 lg:col-span-2 h-screen flex flex-col bg-slate-900 border-r border-slate-800">
        
        <div class="telemetry-bar px-4 pt-3 pb-1 bg-slate-950/40 border-b border-slate-800/40 flex items-center justify-between">
          <span class="text-[10px] font-mono font-bold tracking-wider text-slate-500 uppercase">Subnet Link:</span>
          
          @if (chatStore.connectionStatus() === 'Connected') {
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[9px] font-bold font-mono bg-emerald-950/50 text-emerald-400 border border-emerald-900/50 uppercase tracking-wider">
              <span class="w-1 h-1 rounded-full bg-emerald-400 mr-1.5 animate-ping"></span>Live
            </span>
          } @else if (chatStore.connectionStatus() === 'Connecting') {
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[9px] font-bold font-mono bg-amber-950/50 text-amber-400 border border-amber-900/50 uppercase tracking-wider">
              <span class="w-1 h-1 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span>Syncing
            </span>
          } @else {
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[9px] font-bold font-mono bg-rose-950/50 text-rose-400 border border-rose-900/50 uppercase tracking-wider">
              <span class="w-1 h-1 rounded-full bg-rose-500 mr-1.5"></span>Offline
            </span>
          }
        </div>

        <app-sidebar class="w-full flex-1"></app-sidebar>
      </div>

      <main class="col-span-9 lg:col-span-10 h-screen overflow-y-auto bg-slate-950 text-slate-100 flex flex-col animate-fade-in">
        <div class="flex-1 w-full max-w-[100vw] overflow-hidden">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>

  } @else {
    
    <main class="flex flex-col w-full h-screen overflow-hidden bg-slate-950">
      <router-outlet></router-outlet>
    </main>

  }
  
</div>
